[package]
name = "notify-playground"
description = "A hands-on tour of cosmonic:notify — fire every notification shape and watch the responses come back"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
# HTTP in/out for a wasmCloud component. Supplies its own bindings for the
# `wasi:http` export, which is why wit/world.wit only declares the imports we
# generate ourselves.
wasmcloud-component = "0.2.0"
# Hand-generated bindings for cosmonic:notify. The host exports this interface;
# nothing needs to be installed for it beyond running on Cosmonic Desktop.
wit-bindgen = "0.46"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
strip = true
