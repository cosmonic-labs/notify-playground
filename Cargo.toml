[package]
name = "notify-playground"
description = "A hands-on tour of cosmonic:notify — fire every notification shape and watch the responses come back"
version = "0.3.0"
edition = "2021"
# p3 build floor: wasip3 0.7 needs the wasm-component-ld bundled with Rust 1.94.
rust-version = "1.94"
license = "Apache-2.0"

[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
# WASI 0.3 (p3). `cosmonic:notify@0.2.0` is all `async func`, and the host
# serves async imports only to a component whose export runs on the async
# (p3) path — so the HTTP side must be `wasi:http/handler@0.3.0`, not the p2
# `incoming-handler`. `http-compat` bridges to the hyperium `http` types.
wasip3 = { version = "0.9.0", features = ["http-compat"] }
# Bindings for cosmonic:notify. Pinned to wasip3's wit-bindgen so the
# generated async code lines up with its runtime.
wit-bindgen = { version = "0.62.0", default-features = false, features = [
    "macros",
    "async",
    "async-spawn",
    "inter-task-wakeup",
] }
http = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
strip = true
