version: "0.1.0"
build:
  command: cargo build --target wasm32-wasip2 --release
  component_path: target/wasm32-wasip2/release/notify_playground.wasm
workload:
  environment:
    config: {}
  # The playground talks to nobody. Deny-all is the default and the right
  # posture for a sample: it needs no network to demonstrate notifications.
  allowedHosts: []
