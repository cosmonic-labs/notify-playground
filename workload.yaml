# Local iteration manifest. `deploy/workload.yaml` is the published one.
apiVersion: runtime.wasmcloud.dev/v1alpha1
kind: Workload
metadata:
  name: notify-playground
  namespace: default
spec:
  hostInterfaces:
    # Inbound HTTP. Must come first — the router takes ingress hostnames from
    # the first wasi:http entry.
    - namespace: wasi
      package: http
      interfaces: [incoming-handler]
      config:
        host: notify.localhost

    # This is the whole ask: declare cosmonic:notify and the host plugin binds
    # it. Nothing to install, no config, no secret.
    - namespace: cosmonic
      package: notify
      version: "0.1.0"
      interfaces: [notifier, events, types]

  components:
    - name: notify-playground
      # `oci-registry.localhost:8200` rather than `oci.localhost:<port>`: both
      # names reach Desktop's built-in registry, but only this one carries the
      # plain-HTTP mirror rule Desktop installs for itself. Pull the other name
      # and the daemon tries TLS and fails with `InvalidContentType`.
      image: oci-registry.localhost:8200/notify-playground:0.2.0
      localResources:
        # The playground dials nothing. Deny-all is both the default and the
        # honest posture for a sample.
        allowedHosts: []
